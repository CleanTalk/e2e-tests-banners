services:
  wordpress:
    image: wordpress:latest
    container_name: banners-e2e-wordpress
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ${PLUGIN_PATH:?Set PLUGIN_PATH to the cleantalk-spam-protect directory}:/var/www/html/wp-content/plugins/cleantalk-spam-protect
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:5.7
    container_name: banners-e2e-db
    ports:
      - "${DB_HOST_PORT:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ppassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
